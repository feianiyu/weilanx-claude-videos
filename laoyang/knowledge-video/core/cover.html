<html><head><meta charset="utf-8"><style>@font-face{font-family:NSC;src:url(__FONT__) format("truetype");font-weight:100 900}
:root{--o:#F59A3A;--tfs:210px;--efs:44px;--sfs:42px}
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;position:relative;background:#050607;font-family:NSC,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:url(__BG__) center/cover}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,7,.50),rgba(5,6,7,.40) 35%,rgba(5,6,7,.50) 62%,rgba(5,6,7,.88) 86%,#050607)}
/* 竖屏 3:4 裁切安全区 y240–1680：所有内容放在里面 */
.chip{position:absolute;left:60px;top:292px;display:flex;align-items:center;gap:16px;font-size:30px;font-weight:800;letter-spacing:3px;color:rgba(255,255,255,.92)}
.chip i{width:4px;height:30px;background:var(--o)}
.col{position:absolute;left:60px;right:60px;top:392px;display:flex;flex-direction:column;align-items:flex-start;gap:34px}
.t{font-size:var(--tfs);font-weight:900;color:var(--o);line-height:1.08;letter-spacing:0;white-space:nowrap;text-shadow:0 8px 28px rgba(0,0,0,.45)}
.en{font-size:var(--efs);font-weight:800;color:#fff;letter-spacing:1px;white-space:nowrap;text-shadow:0 3px 12px rgba(0,0,0,.7)}
.s{font-size:var(--sfs);font-weight:900;color:#fff;line-height:1.62;letter-spacing:1px;white-space:nowrap;text-shadow:0 3px 14px rgba(0,0,0,.75)}
.pill{display:inline-flex;align-items:baseline;gap:18px;background:var(--o);color:#14110d;border-radius:60px;padding:20px 48px 20px 44px;margin-top:6px}
.pill b{font-size:50px;font-weight:900}.pill span{font-size:34px;font-weight:900;letter-spacing:2px}
.lock{position:absolute;left:0;right:0;top:1560px;display:flex;justify-content:center;align-items:center;gap:22px}
.lock .bar{width:5px;height:54px;background:var(--o)}.lock .nm{font-size:44px;font-weight:900;letter-spacing:6px}
.lock .sb{font-size:26px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:4px}</style></head><body>
<div class="bg"></div><div class="sh"></div>
<div class="chip"><i></i>__CHIP__</div>
<div class="col"><div class="t" id="tt">__TT__</div><div class="en" id="en">__EN__</div><div class="s" id="ss">__SS__</div><div class="pill" id="pill"><b>__TAG__</b><span>__TAG2__</span></div></div>
<div class="lock"><svg width="84" height="84" viewBox="-56 -56 112 112"><g fill="none" stroke="#3EF09A" stroke-width="11.5"><polyline points="-29,-33 0,-50 29,-33"/><polyline points="-45,-24 0,2 45,-24"/><polyline points="-41,-8 -41,24 -12,41"/><polyline points="41,-8 41,24 12,41"/></g><polygon points="-5.75,2 5.75,2 5.75,46.7 0,50 -5.75,46.7" fill="#3EF09A"/></svg><span class="bar"></span><span class="nm">老杨魔方</span><span class="sb">企业经营观察</span></div></body></html>
