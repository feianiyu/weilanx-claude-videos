 let act=-1;stT.forEach((s,i)=>{if(tc>=s)act=i;});let fx=60;if(act>=0){const p=io(cl((tc-stT[act])/0.5));const pv=act>0?DX[act-1]:60;fx=pv+(DX[act]-pv)*p;}
 pfill.style.width=Math.max(0,fx-60)+'px';prog.style.opacity=rest?0.5:1;
 pdots.forEach((d,i)=>{const on=i<=act;d.style.background=on?'#F5A623':'#15171a';d.style.borderColor=on?'#F5A623':'rgba(255,255,255,.55)';});
 plabs.forEach((l,i)=>{l.style.color=i===act?'#F5A623':'#9AA3AB';});
 // ----- 声波（真实时间） -----
 const lv=WS.length?parseInt(WS[Math.min(WS.length-1,Math.max(0,f))],36)/35:0;
 bars.forEach((b,i)=>{const j=0.62+0.38*Math.abs(Math.sin(f*0.37+i*1.93)*Math.cos(f*0.21+i*0.71));b.style.height=(4+40*lv*env[i]*j).toFixed(1)+'px';});
 // ----- 头像：近 6 帧声音包络（平滑，不闪）→ 光晕 + 轻微放大；不说话时微暗 -----
 if(D.avatar){let m=0;for(let k=-4;k<=1;k++)m+=lvAt(f+k);m/=6;const q=Math.min(1,m*1.6);
  AV.style.transform=`scale(${(1+0.05*q).toFixed(3)})`;
  AV.style.boxShadow=`0 0 0 3px rgba(0,0,0,.35),0 0 ${(6+26*q).toFixed(1)}px ${(1+7*q).toFixed(1)}px rgba(245,166,35,${(0.18+0.6*q).toFixed(2)})`;
  AV.style.filter=`brightness(${(0.82+0.18*q).toFixed(3)})`;}
 // ----- 字幕 -----
 const tt=f/30;let si=-1;for(let i=0;i<D.subs.length;i++){const s=D.subs[i];if(tt>=s.s-0.05&&tt<s.e+0.2){si=i;break;}}
 if(si!==lastSub){if(si>=0){const s=D.subs[si];subEl.innerHTML=s.lines.map(x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('<br>');subEl.style.fontSize=s.fs+'px';}else subEl.innerHTML='';lastSub=si;}
 subEl.style.opacity=si>=0?cl((tt-D.subs[si].s+0.05)/0.12):0;
}
window.render=render;window.DUR=D.dur;
render(0);
if(!cap){const au=$('au'),pp=$('pp'),sk=$('seek'),tcl=$('tc');
 $('dur').textContent=D.dur.toFixed(1)+'s';
 const fmt=t=>Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0');
 pp.onclick=()=>{if(au.paused)au.play();else au.pause();};
 au.onplay=()=>pp.textContent='❚❚ 暂停';au.onpause=()=>pp.textContent='▶ 播放';
 let drag=false;sk.oninput=()=>{drag=true;const t=sk.value/1000*D.dur;au.currentTime=t;render(t);tcl.textContent=fmt(t);};sk.onchange=()=>drag=false;
 (function loop(){const t=au.currentTime;if(!au.paused)render(t);if(!drag)sk.value=t/D.dur*1000;tcl.textContent=fmt(t);requestAnimationFrame(loop);})();
 document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pp.onclick();}});
}
